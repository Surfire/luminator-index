[package]
name = "luminator-index"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Local filename search engine and CLI for macOS"
repository = "https://github.com/Surfire/luminator-index"

[[bin]]
name = "luminator"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
rusqlite = "0.40"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
